name: Publish Beyond Code to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Markdown renderer
        run: python -m pip install markdown-it-py==4.0.0
      - name: Build and verify bilingual reader
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: python tools/build_github_pages.py --base-path "$PAGES_BASE_PATH" --output "$RUNNER_TEMP/beyond-code-pages"
      - name: Upload static reader
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/beyond-code-pages

  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the reader
        id: deployment
        uses: actions/deploy-pages@v4
